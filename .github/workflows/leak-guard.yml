name: leak-guard

# Public repo: no developer-machine paths or Claude session URLs in tracked
# files. Plans and briefs written by agents carry these by default
# (audit 2026-09-23); a scrub is a state, so the check has to keep running.
# Placeholders like /home/<user> pass. The character classes keep this file
# from matching its own pattern.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-dev-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No developer-machine paths or session URLs in tracked files
        run: |
          if git grep -nIE '/home[/]mjarnol[d]|/mnt/c[/]Users/a2b3[2]|[Cc]:[\\/]+Users[\\/]+a2b3[2]|claude[.]ai/code/session[_]'; then
            echo "::error::developer-machine path or Claude session URL in a tracked file (use /home/<user>, <session-url>)"
            exit 1
          fi
