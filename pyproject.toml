[project]
name = "dyson-tree"
version = "1.0.1"
description = "Carbon-budget model for a photosynthetic organism under 1/r^2 insolation"
requires-python = ">=3.13"
# Versions in use when experiments/q1_crossover was run. The reported r* comes
# out of scipy.optimize.brentq bracketed by a numpy grid, so the numeric stack
# is part of the result's provenance, not an incidental build detail.
dependencies = [
    "numpy==2.3.5",
    "scipy==1.16.3",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.15",
]

# Explicit discovery: the flat layout also holds `web/` (the static explorer) and
# `experiments/` (runners), which setuptools would otherwise refuse as "multiple
# top-level packages" — the Pages build failed on exactly that (run 34559785038).
[tool.setuptools.packages.find]
include = ["sim*", "experiments*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# `slow` is the §4 census: a 59,691-node scan under both laws, minutes per law.
# Deselected by default so `pytest -q` stays a fast gate; run it with `pytest -m slow`.
# Its always-on half is test_committed_output_matches_the_census, which reads the
# committed tools/q4_hand_rows.out.
markers = ["slow: multi-minute grid scans (the section 4 census)"]
addopts = "-m 'not slow'"
